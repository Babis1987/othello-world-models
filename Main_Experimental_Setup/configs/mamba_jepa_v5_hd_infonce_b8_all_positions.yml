experiment:
  name: mamba_jepa_v5_hd_infonce_allpos_b8
  # The all-position v5 objective uses the generic horizon-1 JEPA execution
  # topology; v5 identity is carried by InfoNCE + EMA + hard-disjoint + all.
  variant: v1
  description: Mamba JEPA v5-style hard-disjoint InfoNCE with all-position supervision on 8x8 Othello.
  notes: |
    Contrastive counterpart of the selected Mamba all-position VICReg run.
    Every valid prefix boundary predicts the next-move target embedding.
    InfoNCE negatives are other games at the same absolute position, preventing
    absolute position from becoming a trivial negative-mining shortcut.
    A frozen EMA target encoder is required because InfoNCE has no VICReg
    anti-collapse terms. All non-objective settings match the v1 all-position
    VICReg baseline for a controlled comparison.

paths:
  data_dir: /content/drive/MyDrive/Master_Thesis_Artifacts/data/othello_8x8
  out_dir: /content/runs/Mamba-JEPA/mamba_jepa_v5_hd_infonce_allpos_b8
  drive_sync_dir: /content/drive/MyDrive/Master_Thesis_Artifacts/runs/Mamba-JEPA/mamba_jepa_v5_hd_infonce_allpos_b8
  drive_sync_every_chunks: 5

data:
  board_size: 8
  li_split_train_chunks: 200

model:
  encoder_architecture: mamba
  n_layers: 15
  n_heads: 8
  d_model: 512
  d_state: 16
  d_conv: 4
  expand: 2
  mamba_backend: mamba_ssm
  dropout: 0.1

predictor:
  predictor_type: linear

objective:
  objective_class: jepa
  view_mode: hard_disjoint_future
  loss_type: infonce
  contrastive_temperature: 0.1
  prediction_horizon: 1
  position_sampling: all
  use_ema_target: true
  ema_momentum: 0.996
  # Execution-only chunking; this does not change the mathematical objective.
  all_position_target_chunk_size: 65536
  all_position_stats_chunk_size: 64

optim:
  batch_size: 256
  learning_rate: 3e-4
  min_lr_ratio: 0.1
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 1000
  passes_over_data: 1
  precision: bf16

eval:
  eval_chunks: 1
  eval_every_chunks: 5

checkpointing:
  checkpoint_every_chunks: 0
  milestone_games: 1000000,5000000,10000000,15000000,20000000
  intermediate_checkpoint_fractions: [0.1, 0.25, 0.5]

runtime:
  num_workers: 0
  seed: 42
