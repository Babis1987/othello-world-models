schema_version: thesis_seeded_replication_v1
protocol_name: canonical_bf16_seed_replication

# The completed headline runs used seed 42.  Four additional, conventional
# seeds produce a five-seed family without reusing the original identity.
original_seed: 42
default_additional_seeds: [0, 1, 2, 3]
required_additional_seed_count: 4

runtime:
  precision: bf16
  mamba_ssm_version: 2.3.2.post1
  causal_conv1d_version: 1.6.2.post1

# This lock is filled from the current authoritative training implementation.
# The orchestrator lives under scripts/, outside the locked mathematical
# package source and outside the Common Evaluator's othello_research digest.
source_lock:
  expected_training_source_sha256: 73a3bc58e5388a9973d7bf57116563df16e5f054c899fdfb1e006ca23155d29f
  include:
    - othello_research/training
    - othello_research/models
    - othello_research/datasets
    - othello_research/objectives
    - othello_research/othello
  exclude: []

config_sha256:
  jepa_v5_infonce_b8_hd_all_positions.yml: 73221f6c83fb5c743bcdcd5dd1e469ce4bab63eef457c04a0741cdba3170afaf
  jepa_v5_infonce_b12_hd_all_positions.yml: 688d952cde6e88dd539fe3f3789564ee8f1cc4921435a51e13851e6829aa839c
  jepa_v5_infonce_b16_hd_all_positions.yml: c6e1eee3d195013be75473ca13f713e1ea909907a4edcf37f57cd97c7e72ae0e
  mamba_jepa_v5_hd_infonce_b8_all_positions.yml: 81a3a330279becb5f5c65a3e9f4a4d4ac56e39bcb6431a5492abc2222ed7ea2c
  mamba_jepa_v5_hd_infonce_b12_all_positions.yml: f7c42e6dce5f6a171a89df5796e0072ba8ea5f7028d29569567a36c8770cc4d5
  mamba_jepa_v5_hd_infonce_b16_all_positions.yml: 7d0844c6816953062bb3ede4598ca5ddd325ec4a589da1e0930535f73c1e474c

data:
  8: data/othello_8x8
  12: data/othello_12x12/corpus_v1
  16: data/othello_16x16/corpus_v1

# Every option below is part of the canonical resolved AR configuration.  The
# launcher passes these values explicitly so a future argparse-default change
# cannot silently alter a replication.
ar_common:
  li_split_train_chunks: 200
  batch_size: 256
  learning_rate: 0.0003
  min_lr_ratio: 0.1
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 1000
  passes_over_data: 1
  total_steps: 0
  games_per_chunk: 100000
  precision: bf16
  num_workers: 0
  eval_chunks: 1
  eval_every_chunks: 5
  milestone_games: 1000000,5000000,10000000,15000000,20000000
  max_chunks: 0
  drive_sync_every_chunks: 5

cases:
  transformer:
    ar:
      trainer_module: othello_research.training.train_gpt
      run_family: Transformer-AR
      model:
        n_layers: 8
        n_heads: 8
        d_model: 512
        dropout: 0.1
      boards:
        8:
          base_run_name: transformer_ar_b8_bf16
          checkpoint_every_chunks: 0
          seed42_reference_status: canonical_bf16_surface_checkpoint_pending
          note: The completed historical run_001 has unreported precision because it predates explicit precision metadata; do not treat it as the bf16 seed-42 reference.
        12:
          base_run_name: transformer_ar_b12
          checkpoint_every_chunks: 0
          seed42_reference_status: completed
        16:
          base_run_name: transformer_ar_b16
          checkpoint_every_chunks: 0
          seed42_reference_status: completed
    jepa:
      trainer_module: othello_research.training.train_jepa
      run_family: Transformer-JEPA
      boards:
        8:
          base_run_name: jepa_v5_infonce_b8_run_001_hd_allpos_bf16
          config: jepa_v5_infonce_b8_hd_all_positions.yml
          seed42_reference_status: completed
        12:
          base_run_name: transformer_jepa_v5_hd_infonce_allpos_b12
          config: jepa_v5_infonce_b12_hd_all_positions.yml
          seed42_reference_status: completed
        16:
          base_run_name: transformer_jepa_v5_hd_infonce_allpos_b16
          config: jepa_v5_infonce_b16_hd_all_positions.yml
          seed42_reference_status: completed
  mamba:
    ar:
      trainer_module: othello_research.training.train_mamba_ar
      run_family: Mamba-AR
      model:
        n_layers: 15
        d_model: 512
        d_state: 16
        d_conv: 4
        expand: 2
        dropout: 0.1
        mlp_hidden_mult: 0
        mamba_backend: mamba_ssm
      boards:
        8:
          base_run_name: mamba_ar_8x8_bf16
          checkpoint_every_chunks: 0
          seed42_reference_status: canonical_bf16_surface_checkpoint_pending
          note: The completed historical mamba_ar_8x8 checkpoint is fp16; do not mix it with this bf16 seed family.
        12:
          base_run_name: mamba_ar_b12
          checkpoint_every_chunks: 0
          seed42_reference_status: completed
        16:
          base_run_name: mamba_ar_b16
          checkpoint_every_chunks: 0
          seed42_reference_status: completed
    jepa:
      trainer_module: othello_research.training.train_mamba_jepa
      run_family: Mamba-JEPA
      boards:
        8:
          base_run_name: mamba_jepa_v5_hd_infonce_allpos_b8
          config: mamba_jepa_v5_hd_infonce_b8_all_positions.yml
          seed42_reference_status: completed
        12:
          base_run_name: mamba_jepa_v5_hd_infonce_allpos_b12
          config: mamba_jepa_v5_hd_infonce_b12_all_positions.yml
          seed42_reference_status: completed
        16:
          base_run_name: mamba_jepa_v5_hd_infonce_allpos_b16
          config: mamba_jepa_v5_hd_infonce_b16_all_positions.yml
          seed42_reference_status: completed
