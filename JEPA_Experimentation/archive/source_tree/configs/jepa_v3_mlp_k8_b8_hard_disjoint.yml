experiment:
  name: jepa_v3_mlp_k8_b8_run_001_hard_disjoint
  variant: v3
  description: Weak-MLP EMA JEPA (K=8) with hard-disjoint future-only target views on 8x8 Othello.
  notes: |
    Hard-disjoint variant of v3: identical to jepa_v3_mlp_k8_b8.yml except the
    target view is hard-disjoint (the EMA target encoder sees only the K future
    tokens x[t:t+K], never the prefix). Predictor capacity, K=8, ema_momentum
    (0.990), and warmup (2000) are unchanged; only view_mode changes from nested
    to hard_disjoint_future.

paths:
  data_dir: /content/drive/MyDrive/Master_Thesis_Artifacts/data/othello_8x8
  out_dir: /content/runs/jepa_v3_mlp_k8_b8_run_001_hard_disjoint
  drive_sync_dir: /content/drive/MyDrive/Master_Thesis_Artifacts/runs/jepa_v3_mlp_k8_b8_run_001_hard_disjoint
  drive_sync_every_chunks: 5

data:
  board_size: 8
  li_split_train_chunks: 200

model:
  n_layers: 8
  n_heads: 8
  d_model: 512
  dropout: 0.1

predictor:
  predictor_type: mlp
  predictor_hidden_dim: 512
  predictor_n_layers: 2
  predictor_dropout: 0.1
  predictor_activation: gelu

objective:
  view_mode: hard_disjoint_future
  loss_type: smooth_l1
  prediction_horizon: 8
  use_ema_target: true
  ema_momentum: 0.990
  smooth_l1_beta: 1.0
  window_sample_attempts: 8

optim:
  batch_size: 512
  learning_rate: 3e-4
  min_lr_ratio: 0.1
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 2000
  passes_over_data: 1
  precision: bf16

eval:
  eval_chunks: 1
  eval_every_chunks: 5

checkpointing:
  milestone_games: 1000000,5000000,10000000,15000000,20000000

runtime:
  num_workers: 0
  seed: 42
