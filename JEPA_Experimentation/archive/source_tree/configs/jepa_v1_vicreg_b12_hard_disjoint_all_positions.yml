experiment:
  name: transformer_jepa_v1_hd_vicreg_allpos_b12
  variant: v1
  description: Transformer JEPA v1 hard-disjoint VICReg with all-position supervision on 12x12 Othello.
  notes: |
    Ablation of the selected v1 protocol. Every valid prefix boundary in each
    game contributes signal. VICReg statistics are computed independently at
    each absolute position across games, then pair-count weighted.

paths:
  data_dir: /content/drive/MyDrive/Master_Thesis_Artifacts/data/othello_12x12/corpus_v1
  out_dir: /content/runs/Transformer-JEPA/transformer_jepa_v1_hd_vicreg_allpos_b12
  drive_sync_dir: /content/drive/MyDrive/Master_Thesis_Artifacts/runs/Transformer-JEPA/transformer_jepa_v1_hd_vicreg_allpos_b12
  drive_sync_every_chunks: 5

data:
  board_size: 12
  li_split_train_chunks: 200

model:
  n_layers: 8
  n_heads: 8
  d_model: 512
  dropout: 0.1

predictor:
  predictor_type: linear

objective:
  objective_class: jepa
  view_mode: hard_disjoint_future
  loss_type: vicreg
  prediction_horizon: 1
  position_sampling: all
  all_position_target_chunk_size: 4096
  all_position_stats_chunk_size: 8
  vicreg_lambda: 25.0
  vicreg_mu: 25.0
  vicreg_nu: 1.0
  variance_threshold: 1.0

optim:
  batch_size: 256
  learning_rate: 3e-4
  min_lr_ratio: 0.1
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 1000
  passes_over_data: 1
  precision: bf16

eval:
  eval_chunks: 1
  eval_every_chunks: 5

checkpointing:
  checkpoint_every_chunks: 0
  milestone_games: 1000000,5000000,10000000,15000000,20000000

runtime:
  num_workers: 0
  seed: 42
