experiment:
  name: jepa_v4_multi_pos_mlp_k4_b8_run_001
  variant: v4
  description: JEPA v4 with disjoint future views and multi-position MLP predictor.
  notes: |
    Primary hypothesis: v2/v3 nested context-target views encouraged shortcut
    learning. v4 uses disjoint future target positions gathered from the EMA
    target encoder. Acknowledged confound: the predictor changes to a
    multi-position MLP so this is not a single-variable ablation.

paths:
  data_dir: /content/drive/MyDrive/Master_Thesis_Artifacts/data/othello_8x8
  out_dir: /content/runs/jepa_v4_multi_pos_mlp_k4_b8_run_001
  drive_sync_dir: /content/drive/MyDrive/Master_Thesis_Artifacts/runs/jepa_v4_multi_pos_mlp_k4_b8_run_001
  drive_sync_every_chunks: 5

data:
  board_size: 8
  li_split_train_chunks: 200

model:
  n_layers: 8
  n_heads: 8
  d_model: 512
  dropout: 0.1

predictor:
  predictor_type: mlp_multi_pos
  predictor_hidden_mult: 4
  predictor_dropout: 0.0

objective:
  view_mode: disjoint_future
  loss_type: smooth_l1
  prediction_horizon: 4
  use_ema_target: true
  ema_momentum: 0.996
  smooth_l1_beta: 1.0
  window_sample_attempts: 8
  log_collapse_stats_every_steps: 100
  collapse_warning_z_std: 0.1
  collapse_warning_cos_sim: 0.95

optim:
  batch_size: 512
  learning_rate: 3e-4
  min_lr_ratio: 0.1
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 1000
  passes_over_data: 1
  precision: bf16

eval:
  eval_chunks: 1
  eval_every_chunks: 5

checkpointing:
  checkpoint_every_chunks: 0
  milestone_games: 1000000,5000000,10000000,15000000,20000000
  intermediate_checkpoint_fractions: [0.1, 0.25, 0.5]

runtime:
  num_workers: 0
  seed: 42

wandb:
  wandb_project: ""
  wandb_entity: ""
  wandb_run_name: ""
  wandb_mode: online
