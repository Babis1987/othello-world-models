# Hard-disjoint VICReg JEPA with no learned predictor.
#
# The context branch sees x[:t]. The shared encoder target branch sees only the
# single future token x[t:t+1], retaining its absolute game position.
# predictor_type=identity applies no learned transformation: the final context
# embedding is matched directly against the target embedding.
#
# There is no EMA target encoder and no stop-gradient target branch. As in v1,
# VICReg's variance and covariance terms provide the anti-collapse pressure.

experiment:
  name: jepa_no_predictor_k1_vicreg_b8_run_001_hard_disjoint
  variant: v1
  description: Hard-disjoint VICReg JEPA with K=1 and no learned predictor.
  notes: |
    The target receives no context prefix and sees only x[t:t+1] at its
    absolute game position. Context and target use the shared v1 encoder and
    both paths receive gradients. Identity prediction has zero trainable
    parameters. VICReg settings match the checked-in v1 reference.

paths:
  data_dir: /content/drive/MyDrive/Master_Thesis_Artifacts/data/othello_8x8
  out_dir: /content/runs/jepa_no_predictor_k1_vicreg_b8_run_001_hard_disjoint
  drive_sync_dir: /content/drive/MyDrive/Master_Thesis_Artifacts/runs/jepa_no_predictor_k1_vicreg_b8_run_001_hard_disjoint
  drive_sync_every_chunks: 5

data:
  board_size: 8
  li_split_train_chunks: 50

model:
  n_layers: 8
  n_heads: 8
  d_model: 512
  dropout: 0.1

predictor:
  # Identity means no learned predictor parameters.
  predictor_type: identity

objective:
  view_mode: hard_disjoint_future
  loss_type: vicreg
  prediction_horizon: 1
  use_ema_target: false
  vicreg_lambda: 25.0
  vicreg_mu: 25.0
  vicreg_nu: 1.0
  variance_threshold: 1.0
  window_sample_attempts: 8
  log_collapse_stats_every_steps: 100
  collapse_warning_z_std: 0.1
  collapse_warning_cos_sim: 0.95

optim:
  batch_size: 512
  learning_rate: 3e-4
  min_lr_ratio: 0.1
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 1000
  passes_over_data: 1
  precision: bf16

eval:
  eval_chunks: 1
  eval_every_chunks: 5

checkpointing:
  checkpoint_every_chunks: 0
  milestone_games: 1000000,5000000,10000000,15000000,20000000
  intermediate_checkpoint_fractions: [0.1, 0.25, 0.5]

runtime:
  num_workers: 0
  seed: 42

wandb:
  wandb_project: ""
  wandb_entity: ""
  wandb_run_name: ""
  wandb_mode: online
