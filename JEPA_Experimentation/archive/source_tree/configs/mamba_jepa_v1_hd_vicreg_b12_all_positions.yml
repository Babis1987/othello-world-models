experiment:
  name: mamba_jepa_v1_hd_vicreg_allpos_b12
  variant: v1
  description: Mamba JEPA v1 hard-disjoint VICReg with all-position supervision on 12x12 Othello.
  notes: |
    Architecture-matched all-position ablation of the selected Mamba v1
    protocol. Position-stratified VICReg prevents absolute-position variance
    from becoming an artificial anti-collapse shortcut.

paths:
  data_dir: /content/drive/MyDrive/Master_Thesis_Artifacts/data/othello_12x12/corpus_v1
  out_dir: /content/runs/Mamba-JEPA/mamba_jepa_v1_hd_vicreg_allpos_b12
  drive_sync_dir: /content/drive/MyDrive/Master_Thesis_Artifacts/runs/Mamba-JEPA/mamba_jepa_v1_hd_vicreg_allpos_b12
  drive_sync_every_chunks: 5

data:
  board_size: 12
  li_split_train_chunks: 200

model:
  encoder_architecture: mamba
  n_layers: 15
  n_heads: 8
  d_model: 512
  d_state: 16
  d_conv: 4
  expand: 2
  mamba_backend: mamba_ssm
  dropout: 0.1

predictor:
  predictor_type: linear

objective:
  objective_class: jepa
  view_mode: hard_disjoint_future
  loss_type: vicreg
  prediction_horizon: 1
  position_sampling: all
  # Execution-only chunking (no effect on the objective). The Mamba length-1
  # fast path allocates no selective-scan state, so all ~35k per-step targets
  # run as one launch-efficient batch, and the ~138-position VICReg stats loop
  # runs in a single pass instead of 18 small launch-bound iterations.
  all_position_target_chunk_size: 65536
  all_position_stats_chunk_size: 138
  vicreg_lambda: 25.0
  vicreg_mu: 25.0
  vicreg_nu: 1.0
  variance_threshold: 1.0

optim:
  batch_size: 256
  learning_rate: 3e-4
  min_lr_ratio: 0.1
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 1000
  passes_over_data: 1
  precision: bf16

eval:
  eval_chunks: 1
  eval_every_chunks: 5

checkpointing:
  checkpoint_every_chunks: 0
  milestone_games: 1000000,5000000,10000000,15000000,20000000
  intermediate_checkpoint_fractions: [0.1, 0.25, 0.5]

runtime:
  num_workers: 0
  seed: 42
