experiment:
  name: jepa_vicreg_b8_run_001
  variant: v1
  description: Single-encoder VICReg JEPA baseline on 8x8 Othello.
  notes: |
    Historical baseline config; implemented by train_jepa.py and
    objectives/jepa.py with internal topology jepa_v1. VICReg weights match
    the checked-in regression reference for this config.

paths:
  data_dir: /content/drive/MyDrive/Master_Thesis_Artifacts/data/othello_8x8
  out_dir: /content/runs/jepa_vicreg_b8_run_001
  drive_sync_dir: /content/drive/MyDrive/Master_Thesis_Artifacts/runs/jepa_vicreg_b8_run_001
  drive_sync_every_chunks: 5

data:
  board_size: 8
  li_split_train_chunks: 50

model:
  n_layers: 8
  n_heads: 8
  d_model: 512
  dropout: 0.1

predictor:
  predictor_type: linear

objective:
  loss_type: vicreg
  prediction_horizon: 1
  vicreg_lambda: 25.0
  vicreg_mu: 25.0
  vicreg_nu: 1.0
  variance_threshold: 1.0

optim:
  batch_size: 256
  learning_rate: 3e-4
  min_lr_ratio: 0.1
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 1000
  passes_over_data: 1
  precision: fp16

eval:
  eval_chunks: 1
  eval_every_chunks: 5

checkpointing:
  milestone_games: 1000000,5000000,10000000,15000000,20000000

runtime:
  num_workers: 0
  seed: 42
