experiment:
  name: jepa_vicreg_b8_run_001_hard_disjoint_allpos_bf16
  variant: v1
  description: Transformer JEPA v1 hard-disjoint VICReg with all-position supervision on 8x8 Othello.
  notes: |
    Supervision-density ablation of the selected historical v1 run. Every
    valid JEPA prefix boundary contributes signal. VICReg statistics are
    computed across games separately at each absolute position and then
    pair-count weighted across positions.

paths:
  data_dir: /content/drive/MyDrive/Master_Thesis_Artifacts/data/othello_8x8
  out_dir: /content/runs/jepa_vicreg_b8_run_001_hard_disjoint_allpos_bf16
  drive_sync_dir: /content/drive/MyDrive/Master_Thesis_Artifacts/runs/jepa_vicreg_b8_run_001_hard_disjoint_allpos_bf16
  drive_sync_every_chunks: 5

data:
  board_size: 8
  li_split_train_chunks: 200

model:
  n_layers: 8
  n_heads: 8
  d_model: 512
  dropout: 0.1

predictor:
  predictor_type: linear

objective:
  objective_class: jepa
  view_mode: hard_disjoint_future
  loss_type: vicreg
  prediction_horizon: 1
  position_sampling: all
  all_position_target_chunk_size: 4096
  all_position_stats_chunk_size: 8
  vicreg_lambda: 25.0
  vicreg_mu: 25.0
  vicreg_nu: 1.0
  variance_threshold: 1.0

optim:
  batch_size: 256
  learning_rate: 3e-4
  min_lr_ratio: 0.1
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 1000
  passes_over_data: 1
  precision: bf16

eval:
  eval_chunks: 1
  eval_every_chunks: 5

checkpointing:
  checkpoint_every_chunks: 0
  milestone_games: 1000000,5000000,10000000,15000000,20000000

runtime:
  num_workers: 0
  seed: 42
